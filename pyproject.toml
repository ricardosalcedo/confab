[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confab-llm"
version = "0.5.0"
description = "Inline hallucination confidence for LLMs via self-consistency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ricardo Salcedo" }]
keywords = ["llm", "hallucination", "confidence", "self-consistency", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
proxy = ["starlette>=0.37.0", "uvicorn>=0.29.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.8", "starlette>=0.37.0", "uvicorn>=0.29.0", "httpx>=0.25.0"]

[project.scripts]
confab = "confab.cli:main"

[project.urls]
Homepage = "https://github.com/ricardosalcedo/confab"
Repository = "https://github.com/ricardosalcedo/confab"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"confab/llm.py" = ["E501"]
"tests/test_proxy.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["confab"]
omit = ["confab/__main__.py", "confab/proxy.py"]


[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B104", "B324"]
